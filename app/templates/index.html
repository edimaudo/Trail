<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f3">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Prepare a route, cache a field guide and stay informed when the trail goes offline.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.css" crossorigin="anonymous">
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js",
      "firebase/app-check": "https://www.gstatic.com/firebasejs/13.4.0/firebase-app-check.js",
      "firebase/ai": "https://www.gstatic.com/firebasejs/13.4.0/firebase-ai.js",
      "dexie": "https://cdn.jsdelivr.net/npm/dexie@4.2.1/dist/dexie.mjs",
      "maplibre-gl": "https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.mjs"
    }
  }
  </script>
  <link rel="apple-touch-icon" href="/icons/trail-192.png">
  <link rel="stylesheet" href="/css/app.css">
  <title>Trail</title>
</head>
<body>
  <div class="app-frame" id="app">
    <header class="topbar">
      <a class="brand-lockup" href="/" aria-label="Trail home"><span class="brand-name">Trail</span></a>
      <div class="display-controls" aria-label="Display preferences">
        <label class="font-control" for="font-size-setting"><span>Text size</span><select id="font-size-setting" aria-label="Text size"><option value="0.75">Small</option><option value="1" selected>Medium</option><option value="1.25">Large</option></select></label>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><span class="theme-toggle-icon" aria-hidden="true">◐</span><span class="theme-toggle-label">Dark mode</span></button>
      </div>
    </header>

    <div class="app-layout">
      <aside class="left-sidebar" aria-label="Trip navigation">
        <nav class="side-navigation" aria-label="Trail sections">
          <button class="nav-item active" data-section="trail" type="button">Trail</button>
          <button class="nav-item" data-section="guide" type="button">Field guide</button>
        </nav>
        <div class="sidebar-divider"></div>
        <div class="sidebar-heading-row"><h2 class="sidebar-section-title">Saved trips</h2><button id="sidebar-new-trip" class="sidebar-add" type="button" aria-label="Create a trip">+</button></div>
        <div id="saved-trips" class="saved-trip-list"><p class="sidebar-empty">Loading saved trips…</p></div>
      </aside>

      <main class="main-content" id="main-content">
        <div id="main-view" class="main-view"><div class="app-loading">Loading your saved trail data…</div></div>
      </main>


    </div>

    <div id="toast" class="toast-message" role="status" aria-live="polite" hidden></div>
  </div>
  <script>
    (() => {
      try {
        const theme = localStorage.getItem('trail-theme') || 'light';
        const scale = localStorage.getItem('trail-font-scale') || '1';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.setProperty('--font-scale', ['0.75','1','1.25'].includes(scale) ? scale : '1');
      } catch (_) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
